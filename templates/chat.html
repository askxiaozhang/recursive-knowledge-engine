<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>学习对话与知识图谱</title>
    <!-- 引入 vis-network 库，用于绘制知识图谱 -->
    <script type="text/javascript" src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/easymde/dist/easymde.min.css">
    <script src="https://unpkg.com/easymde/dist/easymde.min.js"></script>
    <style>
        :root {
            --primary: #007bff;
            --primary-hover: #0056b3;
            --bg: #f4f6f9;
            --text: #333;
            --border: #dee2e6;
            --chat-bg: #fff;
            --ai-msg-bg: #f8f9fa;
            --user-msg-bg: #007bff;
            --user-msg-color: #fff;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            background-color: var(--bg);
            color: var(--text);
            overflow: hidden;
        }

        /* 顶部导航兰 */
        .navbar {
            position: absolute;
            top: 0;
            width: 100%;
            height: 50px;
            background: #fff;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            padding: 0 20px;
            box-sizing: border-box;
            z-index: 100;
        }

        .back-btn {
            text-decoration: none;
            color: var(--primary);
            font-weight: bold;
            font-size: 14px;
        }

        .title {
            margin-left: 20px;
            font-weight: bold;
            font-size: 16px;
        }

        /* 主体分栏布局 */
        .main-container {
            display: flex;
            width: 100%;
            height: calc(100vh - 50px);
            margin-top: 50px;
        }

        /* 左侧知识图谱 */
        .graph-pane {
            flex: 1;
            border-right: 1px solid var(--border);
            background: #fff;
            display: flex;
            flex-direction: column;
        }

        .pane-header {
            padding: 10px 20px;
            border-bottom: 1px solid var(--border);
            background: #f8f9fa;
            font-weight: bold;
            font-size: 14px;
            color: #555;
        }

        #mynetwork {
            flex: 1;
            width: 100%;
            height: 100%;
        }

        /* 右侧对话区 */
        .chat-pane {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: var(--chat-bg);
            max-width: 600px;
        }

        .chat-history {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            scroll-behavior: smooth;
        }

        .message {
            margin-bottom: 20px;
            display: flex;
            flex-direction: column;
            width: 100%;
        }

        .message.user {
            align-items: flex-end;
        }

        .message.ai {
            align-items: flex-start;
        }

        .bubble {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 14px;
            line-height: 1.5;
            word-wrap: break-word;
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.05);
        }

        .message.user .bubble {
            background-color: var(--user-msg-bg);
            color: var(--user-msg-color);
            border-bottom-right-radius: 2px;
        }

        .message.ai .bubble {
            background-color: var(--ai-msg-bg);
            color: var(--text);
            border: 1px solid var(--border);
            border-bottom-left-radius: 2px;
            white-space: pre-wrap;
            /* 保持换行 */
        }

        /* 输入区 */
        .input-area {
            display: flex;
            padding: 15px 20px;
            border-top: 1px solid var(--border);
            background: #fff;
            align-items: center;
        }

        .input-box {
            flex: 1;
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 12px 20px;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }

        .input-box:focus {
            border-color: var(--primary);
        }

        .send-btn {
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            margin-left: 10px;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: background 0.2s;
        }

        .send-btn:hover {
            background: var(--primary-hover);
        }

        .send-btn:disabled {
            background: var(--disabled);
            cursor: not-allowed;
        }

        .send-btn svg {
            width: 18px;
            height: 18px;
            fill: currentColor;
        }

        /* 加载动画 */
        .typing-indicator {
            display: flex;
            align-items: center;
            padding: 12px 16px;
            background-color: var(--ai-msg-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            border-bottom-left-radius: 2px;
            width: fit-content;
        }

        .typing-indicator span {
            height: 6px;
            width: 6px;
            background: #888;
            border-radius: 50%;
            display: inline-block;
            margin: 0 2px;
            animation: bounce 1.4s infinite ease-in-out both;
        }

        .typing-indicator span:nth-child(1) {
            animation-delay: -0.32s;
        }

        .typing-indicator span:nth-child(2) {
            animation-delay: -0.16s;
        }

        @keyframes bounce {

            0%,
            80%,
            100% {
                transform: scale(0);
            }

            40% {
                transform: scale(1);
            }
        }

        /* 隐藏滚动条但保留功能 */
        ::-webkit-scrollbar {
            width: 6px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: #c1c1c1;
            border-radius: 3px;
        }

        /* 专业名词高亮样式 */
        .term-highlight {
            font-weight: bold;
            text-decoration: underline;
            color: var(--primary);
            cursor: pointer;
            transition: all 0.2s ease;
            padding: 0 2px;
            border-radius: 4px;
        }

        .term-highlight:hover {
            color: var(--primary-hover);
            background-color: rgba(0, 123, 255, 0.1);
        }

        /* 中间笔记区 */
        .notes-pane {
            width: 400px;
            min-width: 200px;
            border-left: 1px solid var(--border);
            border-right: 1px solid var(--border);
            background: #fff;
            display: none;
            flex-direction: column;
            overflow: hidden;
            flex-shrink: 0;
        }

        .notes-pane.visible {
            display: flex;
        }

        /* 拖拽条 */
        .resizer {
            width: 8px;
            cursor: col-resize;
            background: transparent;
            transition: background 0.2s;
            position: relative;
            flex-shrink: 0;
            z-index: 10;
        }

        .resizer:hover,
        .resizer.dragging {
            background: rgba(0, 123, 255, 0.2);
        }

        /* 调整其他布局以支持拖拽 */
        .graph-pane {
            flex: 1;
            min-width: 200px;
            display: flex;
            flex-direction: column;
        }

        .chat-pane {
            flex: 1;
            min-width: 300px;
            max-width: none;
        }

        .notes-header {
            padding: 10px 20px;
            border-bottom: 1px solid var(--border);
            background: #f8f9fa;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .notes-title {
            font-weight: bold;
            font-size: 14px;
            color: #333;
        }

        .close-notes {
            cursor: pointer;
            color: #999;
            font-size: 18px;
        }

        .close-notes:hover {
            color: #333;
        }

        .notes-content {
            flex: 1;
            padding: 15px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            /* 防止超出 */
        }

        .notes-editor {
            flex: 1;
            width: 100%;
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 12px;
            font-size: 14px;
            line-height: 1.6;
            resize: none;
            outline: none;
            font-family: inherit;
        }

        .notes-editor:focus {
            border-color: var(--primary);
        }

        /* 覆盖 EasyMDE 以支持 Flex 收缩与展开 */
        .notes-content .EasyMDEContainer {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            width: 100%;
        }

        .notes-content .CodeMirror {
            flex: 1;
            overflow-y: auto;
            border-bottom-left-radius: 8px;
            border-bottom-right-radius: 8px;
        }

        .notes-content .editor-toolbar {
            border-top-left-radius: 8px;
            border-top-right-radius: 8px;
        }

        .notes-footer {
            padding: 10px 15px;
            border-top: 1px solid var(--border);
            display: flex;
            justify-content: flex-end;
        }

        .save-notes-btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 6px 15px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
        }

        .save-notes-btn:hover {
            background: var(--primary-hover);
        }
    </style>
</head>

<body>

    <div class="navbar">
        <a href="/" class="back-btn">&larr; 返回首页</a>
        <div class="title">递归学习引擎 - 领域对话</div>
        <select id="domainSelector"
            style="margin-left: 20px; background: rgba(0, 0, 0, 0.05); border: 1px solid var(--border); border-radius: 8px; padding: 4px 8px; font-size: 13px;"
            onchange="switchDomain(this.value)">
            {% for domain in all_domains %}
            <option value="{{ domain.id }}" {% if domain.id==current_domain_id %}selected{% endif %}>{{ domain.name }}
            </option>
            {% endfor %}
        </select>
        <div style="flex: 1;"></div>
        <button class="backup-btn" onclick="uploadBackup()"
            style="margin-right: 20px; background-color: #28a745; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 14px;">上传云端备份
            (clouddb)</button>
    </div>

    <div class="main-container">
        <!-- 左侧：知识图谱 -->
        <div class="graph-pane" id="graphPane">
            <div class="pane-header">当前学习关系 (Relative Knowledge Graph)</div>
            <div id="mynetwork"></div>
        </div>

        <!-- 拖拽条 1 -->
        <div class="resizer" id="resizerLeft"></div>

        <!-- 中间：笔记编辑区 -->
        <div id="notesPane" class="notes-pane">
            <div class="notes-header">
                <div class="notes-title" id="notesTitle">笔记: [节点]</div>
                <div class="close-notes" onclick="closeNotes()">&times;</div>
            </div>
            <div class="notes-content">
                <textarea id="notesEditor" class="notes-editor" placeholder="在这里输入关于该节点的学习笔记..."></textarea>
            </div>
            <div class="notes-footer">
                <span id="saveStatus"
                    style="margin-right: 10px; font-size: 12px; color: #888; display: none;">已保存</span>
                <button class="save-notes-btn" onclick="saveNotes()">保存笔记</button>
            </div>
        </div>

        <!-- 拖拽条 2 -->
        <div class="resizer" id="resizerRight"></div>

        <!-- 右侧：AI 对话 -->
        <div class="chat-pane" id="chatPane">
            <div class="chat-history" id="chatHistory">
                <!-- Data will be loaded by JS -->
            </div>

            <div class="input-area">
                <input type="text" id="userInput" class="input-box" placeholder="输入你想学习的内容，例如：解释一下什么是Transformer..."
                    autocomplete="off">
                <button id="sendBtn" class="send-btn" onclick="sendMessage()">
                    <!-- 发送图标 -->
                    <svg viewBox="0 0 24 24">
                        <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z" />
                    </svg>
                </button>
            </div>
        </div>
    </div>

    <script>
        // ==========================================
        // 1. 初始化 Vis.js 知识图谱
        // ==========================================
        const initialNodes = {{ initial_nodes | tojson | safe }};
        const initialEdges = {{ initial_edges | tojson | safe }};
        const chatHistoryData = {{ chat_history | tojson | safe }};
        const currentDomainId = {{ current_domain_id|default ('null') }};

        function switchDomain(domainId) {
            window.location.href = "/chat?domain_id=" + domainId;
        }

        // 存储当前图谱数据的对象
        const nodes = new vis.DataSet(initialNodes);
        const edges = new vis.DataSet(initialEdges);

        const container = document.getElementById('mynetwork');
        const data = { nodes: nodes, edges: edges };

        const options = {
            nodes: {
                shape: 'dot',
                size: 20,
                font: { size: 14, color: '#333' },
                borderWidth: 2,
                shadow: true
            },
            edges: {
                width: 2,
                font: { size: 12, align: 'middle' },
                arrows: { to: { enabled: true, scaleFactor: 0.5 } },
                color: { color: '#aaa', highlight: '#007bff' },
                smooth: { type: 'continuous' }
            },
            groups: {
                concept: { color: { background: '#97c2fc', border: '#2b7ce9' } },
                model: { color: { background: '#fb7e81', border: '#fa0a10' } },
                architecture: { color: { background: '#ffcc00', border: '#e6b800' } },
                domain: { color: { background: '#7be141', border: '#41a906' } }
            },
            physics: {
                forceAtlas2Based: { gravitationalConstant: -50, centralGravity: 0.01, springLength: 100, springConstant: 0.08 },
                maxVelocity: 50,
                solver: 'forceAtlas2Based',
                timestep: 0.35,
                stabilization: { iterations: 150 }
            }
        };

        const network = new vis.Network(container, data, options);

        let currentEditingNodeId = null;

        // 绑定节点点击事件：点击时清空上下文，并触发新的一轮“什么是 xxx？”
        network.on("click", async function (params) {
            if (params.nodes.length > 0) {
                const nodeId = params.nodes[0];
                const node = nodes.get(nodeId);
                const nodeLabel = node.label || nodeId;

                // 1. 清空前端界面的对话上下文
                chatHistory.innerHTML = '';
                appendMessage('ai', `正在重新聚焦学习知识点：[${nodeLabel}]，历史上下文已为您清空。`);

                // 2. 调用后端接口清空当前聊天记录（不影响知识图谱本体）
                try {
                    await fetch('/api/chat/clear', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ domain_id: currentDomainId })
                    });
                } catch (e) {
                    console.error("清空历史记录失败:", e);
                }

                // 3. 自动填入并发送新的问题
                userInput.value = `什么是${nodeLabel}？`;
                sendMessage();
            }
        });

        // 绑定右键点击事件：取消拦截，改回系统默认，或者只在必要时拦截
        network.on("onContext", function (params) {
            // 不再拦截右键，让用户可以用系统右键
        });

        // 绑定双击节点事件：展开笔记
        network.on("doubleClick", function (params) {
            if (params.nodes.length > 0) {
                const nodeId = params.nodes[0];
                const node = nodes.get(nodeId);
                openNotes(nodeId, node.label || nodeId);
            }
        });

        // ==========================================
        // 2. 对话与接口逻辑
        // ==========================================
        const userInput = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');
        const chatHistory = document.getElementById('chatHistory');

        /**
         * 在消息气泡中高亮专业名词
         */
        function renderMessageWithHighlights(bubble, text, entities) {
            if (!entities || entities.length === 0) {
                bubble.innerText = text;
                return;
            }

            // 按长度从大到小排序，防止长度短的名词先被替换
            const sortedEntities = [...entities].sort((a, b) => b.label.length - a.label.length);

            let html = text;
            // 为了避免重复替换（例如替换了 A 包含 B 的情况，或者替换出的 HTML 标签被再次匹配）
            // 我们先找到所有匹配项，记录位置，或者简单起见使用特定的占位符

            // 简单实现：使用标记位替换
            const replacements = [];
            sortedEntities.forEach((ent, index) => {
                const label = ent.label;
                const id = ent.id;
                const escapedLabel = label.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
                const regex = new RegExp(escapedLabel, 'g');

                if (regex.test(html)) {
                    // 使用唯一占位符
                    const placeholder = `___TERM_${index}___`;
                    html = html.replace(regex, placeholder);
                    replacements.push({
                        placeholder: placeholder,
                        html: `<span class="term-highlight" data-node-id="${id}">${label}</span>`
                    });
                }
            });

            // 还原占位符为 HTML
            replacements.forEach(r => {
                html = html.split(r.placeholder).join(r.html);
            });

            bubble.innerHTML = html;

            // 绑定事件
            bubble.querySelectorAll('.term-highlight').forEach(el => {
                const nodeId = el.getAttribute('data-node-id');
                const label = el.innerText;

                // 点击：图谱中高亮
                el.onclick = (e) => {
                    highlightNodeInGraph(nodeId);
                };

                // 双击：打开笔记
                el.ondblclick = (e) => {
                    e.preventDefault();
                    e.stopPropagation();
                    openNotes(nodeId, label);
                };
            });
        }

        /**
         * 在图谱中高亮并聚焦节点
         */
        function highlightNodeInGraph(nodeId) {
            if (nodes.get(nodeId)) {
                network.selectNodes([nodeId]);
                network.focus(nodeId, {
                    scale: 1.2,
                    animation: {
                        duration: 1000,
                        easingFunction: 'easeInOutQuad'
                    }
                });
            }
        }

        // 回车发送
        userInput.addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                sendMessage();
            }
        });

        function appendMessage(role, text, entities = null) {
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${role}`;

            const bubble = document.createElement('div');
            bubble.className = 'bubble';

            if (role === 'ai') {
                renderMessageWithHighlights(bubble, text, entities || nodes.get());
            } else {
                bubble.innerText = text;
            }

            msgDiv.appendChild(bubble);
            chatHistory.appendChild(msgDiv);
            scrollToBottom();
        }

        // 渲染历史数据
        if (chatHistoryData && chatHistoryData.length > 0) {
            chatHistoryData.forEach(msg => {
                appendMessage(msg.role, msg.content);
            });
        } else {
            // 默认语
            appendMessage('ai', '你好！我是你的学习助手。我们可以开始讨论任何专业话题。在对话过程中，我会自动提取专业名词并建立知识图谱。你想学点什么？');
        }

        function showTyping() {
            const msgDiv = document.createElement('div');
            msgDiv.className = 'message ai typing';
            msgDiv.id = 'typingIndicator';

            const indicator = document.createElement('div');
            indicator.className = 'typing-indicator';
            indicator.innerHTML = '<span></span><span></span><span></span>';

            msgDiv.appendChild(indicator);
            chatHistory.appendChild(msgDiv);
            scrollToBottom();
        }

        function removeTyping() {
            const el = document.getElementById('typingIndicator');
            if (el) el.remove();
        }

        function scrollToBottom() {
            chatHistory.scrollTop = chatHistory.scrollHeight;
        }

        // ==========================================
        // 3. 更新图谱逻辑
        // ==========================================
        function updateGraph(newEntities, newRelations) {
            // 合并节点
            newEntities.forEach(entity => {
                if (!nodes.get(entity.id)) {
                    nodes.add({
                        id: entity.id,
                        label: entity.label || entity.id,
                        group: entity.group || 'concept'
                    });
                }
            });

            // 合并关系
            newRelations.forEach(rel => {
                // 检查是否已存在相同的边避免重复绘制
                const edgeId = `${rel.from}-${rel.to}-${rel.label}`;
                if (!edges.get(edgeId)) {
                    edges.add({
                        id: edgeId,
                        from: rel.from,
                        to: rel.to,
                        label: rel.label
                    });
                }
            });

            // 聚焦到新节点（如果有）
            if (newEntities.length > 0) {
                // network.fit({ animation: true });
            }
        }

        function appendMessageStream(role) {
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${role}`;

            const bubble = document.createElement('div');
            bubble.className = 'bubble';
            bubble.innerText = '';

            msgDiv.appendChild(bubble);
            chatHistory.appendChild(msgDiv);
            scrollToBottom();
            return bubble;
        }

        async function sendMessage() {
            const text = userInput.value.trim();
            if (!text) return;

            // 1. 显示用户消息
            appendMessage('user', text);
            userInput.value = '';

            // 2. 锁定输入，显示加载
            userInput.disabled = true;
            sendBtn.disabled = true;

            try {
                // 3. 请求 API (流式)
                const res = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: text, domain_id: currentDomainId })
                });

                if (!res.ok) {
                    let errData = {};
                    try { errData = await res.json(); } catch (e) { }
                    appendMessage('ai', '抱歉，接口返回错误：' + (errData.msg || '未知错误'));
                    return;
                }

                const reader = res.body.getReader();
                const decoder = new TextDecoder('utf-8');
                let buffer = "";
                let eventBuffer = "";
                let aiBubble = appendMessageStream('ai');

                // 4. 处理流式事件
                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;

                    const chunkStr = decoder.decode(value, { stream: true });
                    eventBuffer += chunkStr;

                    let eolIndex;
                    while ((eolIndex = eventBuffer.indexOf('\n\n')) >= 0) {
                        const ev = eventBuffer.substring(0, eolIndex);
                        eventBuffer = eventBuffer.substring(eolIndex + 2);

                        if (ev.startsWith('data: ')) {
                            const dataStr = ev.substring(6);
                            if (dataStr.trim() === '') continue;
                            try {
                                const payload = JSON.parse(dataStr);
                                if (payload.type === 'chunk') {
                                    buffer += payload.content;
                                    // 使用正则容错匹配JSON中 "reply" 字段的内容
                                    const match = buffer.match(/"reply"\s*:\s*"((?:[^"\\]|\\.)*)/);
                                    if (match) {
                                        aiBubble.innerText = match[1].replace(/\\n/g, '\n').replace(/\\"/g, '"');
                                        scrollToBottom();
                                    } else {
                                        // 全量匹配作为 fallback
                                        const fullMatch = buffer.match(/"reply"\s*:\s*"([\s\S]*?)(?:"\s*,|"\s*\})/);
                                        if (fullMatch) {
                                            aiBubble.innerText = fullMatch[1].replace(/\\n/g, '\n').replace(/\\"/g, '"');
                                            scrollToBottom();
                                        }
                                    }
                                } else if (payload.type === 'done') {
                                    if (payload.entities || payload.relations) {
                                        updateGraph(payload.entities || [], payload.relations || []);
                                    }
                                    if (payload.reply_final) {
                                        // 最终渲染带高亮的内容
                                        renderMessageWithHighlights(aiBubble, payload.reply_final, payload.entities);
                                    }
                                    scrollToBottom();
                                } else if (payload.type === 'error') {
                                    appendMessage('ai', '出现异常：' + payload.content);
                                }
                            } catch (e) {
                                console.error('解析 SSE 数据错误:', e, dataStr);
                            }
                        }
                    }
                }
            } catch (err) {
                appendMessage('ai', '网络请求失败，请检查服务是否运行正常。');
                console.error(err);
            } finally {
                // 6. 恢复输入
                userInput.disabled = false;
                sendBtn.disabled = false;
                userInput.focus();
            }
        }

        async function uploadBackup() {
            try {
                const res = await fetch('/api/backup/upload', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({})
                });

                const data = await res.json();
                if (res.ok && data.code === 0) {
                    alert('上传到 clouddb 成功！时间: ' + data.backup_date);
                } else {
                    alert('备份失败：' + (data.msg || '未知错误'));
                }
            } catch (err) {
                alert('网络连接错误，请检查云端服务（clouddb）是否运行。');
                console.error(err);
            }
        }

        // ==========================================
        // 4. 笔记功能逻辑
        // ==========================================
        const notesPane = document.getElementById('notesPane');
        const notesTitle = document.getElementById('notesTitle');
        const notesEditorEle = document.getElementById('notesEditor');
        const saveStatus = document.getElementById('saveStatus');

        let easyMDE = null;

        // openNotes 取消此处的重复定义，因为后面挂载到了 window.openNotes 上

        function closeNotes() {
            notesPane.classList.remove('visible');
            currentEditingNodeId = null;
        }

        async function saveNotes() {
            if (!currentEditingNodeId) return;

            const notes = easyMDE ? easyMDE.value() : notesEditorEle.value;
            saveStatus.innerText = '正在保存...';
            saveStatus.style.display = 'inline';

            try {
                const res = await fetch(`/api/notes/${currentEditingNodeId}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ notes: notes, domain_id: currentDomainId })
                });
                const data = await res.json();
                if (data.code === 0) {
                    saveStatus.innerText = '已保存';
                    setTimeout(() => {
                        if (saveStatus.innerText === '已保存') {
                            saveStatus.style.display = 'none';
                        }
                    }, 2000);
                } else {
                    saveStatus.innerText = '保存失败';
                }
            } catch (err) {
                console.error(err);
                saveStatus.innerText = '网络错误';
            }
        }

        // ==========================================
        // 5. 拖拽调整宽度逻辑
        // ==========================================
        const graphPane = document.getElementById('graphPane');
        const chatPane = document.getElementById('chatPane');
        const resizerLeft = document.getElementById('resizerLeft');
        const resizerRight = document.getElementById('resizerRight');

        let isResizing = false;
        let activeResizer = null;

        resizerLeft.addEventListener('mousedown', (e) => {
            isResizing = true;
            activeResizer = 'left';
            document.body.style.cursor = 'col-resize';
            resizerLeft.classList.add('dragging');
        });

        resizerRight.addEventListener('mousedown', (e) => {
            isResizing = true;
            activeResizer = 'right';
            document.body.style.cursor = 'col-resize';
            resizerRight.classList.add('dragging');
        });

        document.addEventListener('mousemove', (e) => {
            if (!isResizing) return;

            const containerRect = document.querySelector('.main-container').getBoundingClientRect();
            const mouseX = e.clientX - containerRect.left;

            if (activeResizer === 'left') {
                // 调整 graphPane 的 flex-basis
                const newWidth = Math.max(200, mouseX);
                graphPane.style.flex = `0 0 ${newWidth}px`;
            } else if (activeResizer === 'right') {
                // 调整 notesPane 的宽度 (此时它是可见的)
                if (notesPane.classList.contains('visible')) {
                    const notesPaneRect = notesPane.getBoundingClientRect();
                    const graphAndResizersWidth = resizerLeft.getBoundingClientRect().right - containerRect.left;
                    const newNotesWidth = Math.max(200, mouseX - graphAndResizersWidth);
                    notesPane.style.width = `${newNotesWidth}px`;
                } else {
                    // 如果笔记窗没开，resizerRight 调整的是左边 graphPane 的 fallback 宽度
                    const newWidth = Math.max(200, mouseX);
                    graphPane.style.flex = `0 0 ${newWidth}px`;
                }
            }
        });

        document.addEventListener('mouseup', () => {
            if (isResizing) {
                isResizing = false;
                document.body.style.cursor = 'default';
                resizerLeft.classList.remove('dragging');
                resizerRight.classList.remove('dragging');
                // 窗口大小变化后，通知 Vis.js 重新计算图谱
                network.redraw();
            }
        });

        // 初始隐藏 resizerRight，因为 notesPane 默认隐藏
        function initLayout() {
            if (!notesPane.classList.contains('visible')) {
                resizerRight.style.display = 'none';
            } else {
                resizerRight.style.display = 'block';
            }
        }

        // 绑定到 window 以便全局调用
        window.openNotes = async (nodeId, label) => {
            currentEditingNodeId = nodeId;
            notesTitle.innerText = `笔记: [${label}]`;
            notesPane.classList.add('visible');
            resizerRight.style.display = 'block';

            if (!easyMDE) {
                easyMDE = new EasyMDE({
                    element: notesEditorEle,
                    spellChecker: false,
                    status: false,
                    autofocus: true,
                    maxHeight: "100%",
                    toolbar: ["bold", "italic", "heading", "|", "quote", "unordered-list", "ordered-list", "|", "link", "image", "|", "preview"]
                });
            }

            // 解决从 display:none 变为显示时，CodeMirror 渲染高度和宽度不对齐的问题
            setTimeout(() => {
                if (easyMDE && easyMDE.codemirror) {
                    easyMDE.codemirror.refresh();
                }
            }, 50);

            easyMDE.value('正在加载笔记...');

            try {
                const res = await fetch(`/api/notes/${nodeId}?domain_id=${currentDomainId}`);
                const data = await res.json();
                if (data.code === 0) {
                    easyMDE.value(data.notes || '');
                } else {
                    easyMDE.value('加载失败: ' + data.msg);
                }
            } catch (err) {
                console.error(err);
                easyMDE.value('网络错误，加载失败。');
            }
            network.redraw();
        };

        window.closeNotes = () => {
            notesPane.classList.remove('visible');
            resizerRight.style.display = 'none';
            currentEditingNodeId = null;
            network.redraw();
        };

        window.saveNotes = saveNotes;

        // 执行初始布局
        initLayout();
    </script>
    </script>
</body>
